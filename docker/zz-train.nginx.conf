server {
    listen 80;
    server_name train.hnzz.top m.train.hnzz.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://train.hnzz.top$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name m.train.hnzz.top;

    ssl_certificate /etc/letsencrypt/live/train.hnzz.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/train.hnzz.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://train.hnzz.top$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name train.hnzz.top;

    ssl_certificate /etc/letsencrypt/live/train.hnzz.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/train.hnzz.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location ~ ^/(documents|videos|media)(/|$) {
        proxy_pass http://10.60.6.101:3084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://10.60.6.101:3082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
