name: zz_train

x-app-environment: &app-environment
  NODE_ENV: production
  PUBLIC_IS_SELFHOSTED: 'true'
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL for the external train database}
  DATABASE_POOL_MAX: '5'
  NODE_EXTRA_CA_CERTS: /run/zz-train-certs/database-ca.pem
  REDIS_URL: redis://redis:6379
  PUBLIC_SERVER_URL: ${DASHBOARD_ORIGIN}/proxy
  DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:?set DASHBOARD_ORIGIN}
  PRIVATE_SERVER_KEY: ${PRIVATE_SERVER_KEY:?set PRIVATE_SERVER_KEY}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
  HLS_SIGNING_SECRET: ${HLS_SIGNING_SECRET:?set HLS_SIGNING_SECRET}
  TRUSTED_ORIGINS: ${DASHBOARD_ORIGIN}
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:?set OBJECT_STORAGE_PUBLIC_ENDPOINT}
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
  OBJECT_STORAGE_BUCKET_VIDEOS: videos
  OBJECT_STORAGE_BUCKET_DOCUMENTS: documents
  OBJECT_STORAGE_BUCKET_MEDIA: media
  OBJECT_STORAGE_MEDIA_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_ENDPOINT}/media
  UPLOAD_MAX_DOCUMENT_MB: '30'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '128mb', '--maxmemory-policy', 'noeviction']
    mem_limit: 192m
    cpus: 0.25
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    mem_limit: 512m
    cpus: 0.5
    ports:
      - '3084:9000'
      - '127.0.0.1:3085:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${DASHBOARD_ORIGIN}
    volumes:
      - minio-data:/data

  api:
    image: zz_train:latest
    restart: unless-stopped
    init: true
    working_dir: /app
    command: ['sh', '/app/docker/entrypoint-api.sh']
    mem_limit: 768m
    cpus: 0.75
    extra_hosts:
      - 'zzdata:10.60.6.199'
    volumes:
      - ./certs/database-ca.pem:/run/zz-train-certs/database-ca.pem:ro
    environment:
      <<: *app-environment
      PORT: '3081'
      NODE_OPTIONS: --max-old-space-size=512
      DINGTALK_ENABLED: ${DINGTALK_ENABLED:-false}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:-}
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      DINGTALK_ORGANIZATION_ID: ${DINGTALK_ORGANIZATION_ID:-}
      DINGTALK_REDIRECT_URI: ${DINGTALK_REDIRECT_URI:-}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3081/').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  dashboard:
    image: zz_train:latest
    restart: unless-stopped
    init: true
    mem_limit: 768m
    cpus: 0.75
    ports:
      - '3082:3082'
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
      PORT: '3082'
      HOST: 0.0.0.0
      ORIGIN: ${DASHBOARD_ORIGIN}
      PUBLIC_IS_SELFHOSTED: 'true'
      PUBLIC_IS_AI_ENABLED: 'false'
      PUBLIC_APP_TITLE: 至臻企业培训
      PUBLIC_APP_DESCRIPTION: 企业内部课程与员工学习平台
      PUBLIC_SERVER_URL: ${DASHBOARD_ORIGIN}/proxy
      PRIVATE_SERVER_URL: http://api:3081
      PRIVATE_SERVER_KEY: ${PRIVATE_SERVER_KEY}
      PRIVATE_APP_HOST: ${APP_HOST:?set APP_HOST}
      PRIVATE_APP_SUBDOMAINS: app
      UPLOAD_MAX_DOCUMENT_MB: '30'
      BODY_SIZE_LIMIT: '52428800'
      CSP_CONNECT_SRC_DOMAINS: ${OBJECT_STORAGE_PUBLIC_ENDPOINT}
      CSP_MEDIA_SRC_DOMAINS: ${OBJECT_STORAGE_PUBLIC_ENDPOINT}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3082/login').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  jobs:
    image: zz_train:latest
    restart: unless-stopped
    init: true
    working_dir: /app
    command: ['node', 'apps/jobs/dist/index.js']
    mem_limit: 512m
    cpus: 0.5
    extra_hosts:
      - 'zzdata:10.60.6.199'
    volumes:
      - ./certs/database-ca.pem:/run/zz-train-certs/database-ca.pem:ro
    environment:
      <<: *app-environment
      NODE_OPTIONS: --max-old-space-size=320
      MEDIA_WORKER_CONCURRENCY: '1'
      TRANSCRIBE_WORKER_CONCURRENCY: '1'
      EMAIL_WORKER_CONCURRENCY: '1'
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis-data:
  minio-data:
