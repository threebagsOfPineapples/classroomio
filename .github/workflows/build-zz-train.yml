name: Build zz_train

on:
  push:
    tags:
      - 'build-zz-train-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-zz-train
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.zz-train
          platforms: linux/amd64
          tags: zz_train:latest
          push: false
          provenance: false
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/zz_train.tar

      - name: Compress image
        run: |
          gzip -1 "${RUNNER_TEMP}/zz_train.tar"
          cd "${RUNNER_TEMP}"
          sha256sum zz_train.tar.gz > zz_train.tar.gz.sha256

      - name: Upload deployment image
        uses: actions/upload-artifact@v4
        with:
          name: zz_train-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zz_train.tar.gz
            ${{ runner.temp }}/zz_train.tar.gz.sha256
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
